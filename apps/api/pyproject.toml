[project]
name = "docent-api"
version = "0.1.0"
description = "Docent API: ingestion, retrieval, and cited answers."
authors = [{ name = "M. Babar Shahzad" }]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.163.1",
    "httpx2>=2.16.0",
    "psycopg[binary,pool]>=3.3.9",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "pyjwt[crypto]>=2.15.1",
    "sqlalchemy>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
docent-export-openapi = "docent_api.openapi:main"
docent-migrate = "docent_api.migrate:main"
docent-measure-models = "docent_api.measure_models:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.vercel]
entrypoint = "src.docent_api.main:app"

[tool.vercel.scripts]
# Applies database migrations for production deployments only (see docent_api/migrate.py).
build = "python -m docent_api.migrate"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
packages = ["docent_api"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]

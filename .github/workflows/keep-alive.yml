name: Keep API awake

# Regular traffic keeps the API's functions warm and, once connected, stops the free
# database from pausing after 7 idle days (ADR 0006, ADR 0008).
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    name: Ping API health
    runs-on: ubuntu-latest
    if: vars.API_URL != ''
    steps:
      - name: Request /health
        run: curl --fail --silent --show-error --max-time 90 --retry 2 "${{ vars.API_URL }}/health"
      - name: Request /health/database (keeps the free database from pausing)
        run: curl --fail --silent --show-error --max-time 90 --retry 2 "${{ vars.API_URL }}/health/database"

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    labels: ["type: chore", "area: infra"]
    groups:
      web-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: uv
    directory: /apps/api
    schedule:
      interval: weekly
    labels: ["type: chore", "area: infra"]
    groups:
      api-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: ["type: chore", "area: infra"]

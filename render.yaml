# Render Blueprint for the Docent API (one service: API and background worker, per ADR 0005).
services:
  - type: web
    name: docent-api
    runtime: python
    plan: free
    rootDir: apps/api
    buildCommand: pip install uv && uv sync --locked --no-dev
    startCommand: uv run --no-sync uvicorn docent_api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.13
